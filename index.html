<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>House Price Predictor</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main class="container">
<section class="hero"><span class="badge">MACHINE LEARNING APP</span><h1>🏠 House Price Predictor</h1>
<p>Estimate a property's price using a Random Forest regression model.</p></section>
<section class="card"><form id="predictionForm"><div class="grid">
<label>Area (sq ft)<input id="area_sqft" type="number" min="300" value="1200" required></label>
<label>Bedrooms<input id="bedrooms" type="number" min="1" value="3" required></label>
<label>Bathrooms<input id="bathrooms" type="number" min="1" value="2" required></label>
<label>House Age (years)<input id="house_age" type="number" min="0" value="5" required></label>
</div><label>Location<select id="location"><option>Noida</option><option>Greater Noida</option><option>Ghaziabad</option><option>Delhi</option><option>Gurugram</option></select></label>
<button id="predictBtn" type="submit">🔮 Predict Price</button></form>
<div id="result" class="result hidden"><p>Estimated Property Price</p><h2 id="price">₹0</h2><small>Model estimate for the supplied details.</small></div>
<div id="error" class="error hidden"></div></section><footer>Python • Flask • Scikit-learn • JavaScript</footer></main>
<script src="/static/script.js"></script></body></html>
